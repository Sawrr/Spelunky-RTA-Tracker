networks:
  spelunky:
    driver: bridge

services:

  db:
    image: docker.io/sawrr/spelunky-rta-tracker-db
    restart: always
    networks:
      - spelunky
  
  app:
    image: docker.io/sawrr/spelunky-rta-tracker-service
    restart: always
    ports:
      - 80:8080
    networks:
      - spelunky